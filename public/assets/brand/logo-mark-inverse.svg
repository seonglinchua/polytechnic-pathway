<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none"
     role="img" aria-label="Polytechnic Pathway">
  <title>Polytechnic Pathway</title>

  <!-- Navy book page (contrasts against light backgrounds) -->
  <path d="M11 7h16a3 3 0 0 1 3 3v20a3 3 0 0 1-3 3H11z" fill="#12294d"/>

  <!-- Coral spine -->
  <rect x="11" y="7" width="5" height="26" rx="2" fill="#e2603f"/>

  <!-- Subtle compass ring -->
  <circle cx="22" cy="20" r="7.5" stroke="#f6efe2" stroke-width="1"
          fill="none" opacity="0.2"/>

  <!-- Cream north needle (visible against navy page) -->
  <path d="M22 12 L25.5 20 L18.5 20 Z" fill="#f6efe2"/>

  <!-- Coral south needle -->
  <path d="M22 28 L25.5 20 L18.5 20 Z" fill="#e2603f" opacity="0.7"/>

  <!-- Gold pivot -->
  <circle cx="22" cy="20" r="2" fill="#c9a24b"/>
</svg>