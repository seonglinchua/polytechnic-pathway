<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 180" role="img" aria-labelledby="logo-title logo-description">
  <title id="logo-title">Polytechnic Pathway</title>
  <desc id="logo-description">
    An open book with a rising coral arrow, followed by the Polytechnic Pathway wordmark.
  </desc>

  <!-- Open-book logo mark -->
  <g id="logo-mark">
    <rect x="10" y="10" width="160" height="160" rx="20" fill="#FFF8EB"/>

    <g
      id="open-book"
      fill="none"
      stroke="#17315C"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path
        d="M28 59h17v70c18-2 32 2 45 12V62C78 49 64 44 45 45v84"
        stroke-width="7"
      />
      <path
        d="M152 59h-17v70c-18-2-32 2-45 12V62c12-13 26-18 45-17v84"
        stroke-width="7"
      />
      <path
        d="M28 59v80c27-3 46 2 62 13 16-11 35-16 62-13V59"
        stroke-width="7"
      />
      <path d="M90 62v90" stroke-width="5"/>
    </g>

    <g
      id="rising-pathway-arrow"
      stroke="#DF6849"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M51 108 70 89l22 19 27-29" fill="none" stroke-width="8"/>
      <path d="m112 74 17-5-4 18z" fill="#DF6849" stroke-width="2"/>
    </g>
  </g>

  <!-- Wordmark for navy or other dark backgrounds -->
  <text
    id="wordmark"
    x="195"
    y="111"
    fill="#FFF8EB"
    font-family="Avenir Next, Avenir, Montserrat, Helvetica Neue, Arial, sans-serif"
    font-size="47"
    font-weight="500"
    letter-spacing="-1.1"
  >Polytechnic Pathway</text>
</svg>
